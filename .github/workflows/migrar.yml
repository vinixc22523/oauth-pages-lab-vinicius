name: migrar
on:
  push:
    branches: [main]
    paths: ['migrations/**']
permissions:
  contents: read
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Aplica as migrações no D1 remoto
        run: npx --yes wrangler d1 migrations apply oauth-sessions-vinicius --remote 2>&1 | tee migracao.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Bonus: resumo por IA no $GITHUB_STEP_SUMMARY
      - run: npm install -g @github/copilot
      - name: Monta o prompt do resumo
        run: |
          {
            echo "Resuma em português, em até 5 linhas, as migrações D1 aplicadas abaixo."
            echo "Log do wrangler:"
            tail -c 6000 migracao.log
            echo "Arquivos SQL alterados neste push:"
            git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- migrations/ || true
          } > prompt-resumo.txt
      - id: resumo
        uses: actions/ai-inference@v1
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        with:
          prompt-file: prompt-resumo.txt
          system-prompt: Você resume mudanças de banco de dados de forma objetiva.
      - name: Escreve o resumo na execução
        run: |
          echo "## Resumo das migrações (IA)" >> "$GITHUB_STEP_SUMMARY"
          cat "${{ steps.resumo.outputs.response-file }}" >> "$GITHUB_STEP_SUMMARY"
